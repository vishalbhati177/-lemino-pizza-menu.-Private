<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lemino Pizza — Admin</title>
<style>
  :root{
    --maroon-deep:#20080d; --maroon:#3c0f18; --gold:#c9a24a; --gold-light:#e8cf8c;
    --cream:#f3e8d3; --ivory:#faf5e8; --forest:#2f4a3a; --red:#a3492f;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--maroon-deep); color:var(--cream); font-family:system-ui,sans-serif; padding:24px;}
  h1{font-size:1.5rem; color:var(--gold-light); margin-bottom:4px;}
  .sub{opacity:.7; font-size:.85rem; margin-bottom:24px;}
  .toolbar{display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap;}
  button, .btn{
    background:var(--gold); color:var(--maroon-deep); border:none; padding:9px 16px;
    border-radius:4px; font-weight:600; cursor:pointer; font-size:.85rem;
  }
  button.secondary{background:transparent; color:var(--gold-light); border:1px solid var(--gold);}
  button.danger{background:var(--red); color:var(--ivory);}
  .category{background:var(--maroon); border:1px solid rgba(201,162,74,.25); border-radius:8px; padding:16px; margin-bottom:18px;}
  .cat-head{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap;}
  .cat-head input{background:transparent; border:none; color:var(--gold-light); font-size:1.2rem; font-weight:700; border-bottom:1px dashed rgba(201,162,74,.4); padding:2px 4px;}
  .cat-head input.desc{color:var(--cream); font-size:.85rem; font-weight:400; opacity:.8;}
  table{width:100%; border-collapse:collapse; font-size:.85rem;}
  th{text-align:left; padding:6px 8px; color:var(--gold-dim,#8a6e30); font-weight:600; font-size:.75rem; text-transform:uppercase; letter-spacing:.04em;}
  td{padding:6px 8px; border-top:1px solid rgba(201,162,74,.12); vertical-align:middle;}
  td input{width:100%; background:rgba(0,0,0,.2); border:1px solid rgba(201,162,74,.2); color:var(--ivory); padding:6px 8px; border-radius:4px; font-size:.85rem;}
  td input[type=number]{width:70px;}
  .thumb{width:56px; height:56px; object-fit:cover; border-radius:4px; border:1px solid rgba(201,162,74,.3); background:var(--maroon-deep); display:block;}
  .thumb-cell{display:flex; align-items:center; gap:8px;}
  .file-btn{font-size:.7rem; padding:5px 8px;}
  .row-actions{display:flex; gap:6px;}
  .save-hint{position:fixed; bottom:20px; right:20px; background:var(--forest); color:var(--ivory); padding:12px 20px; border-radius:6px; opacity:0; transition:opacity .3s; pointer-events:none; font-size:.85rem;}
  .save-hint.show{opacity:1;}
  .add-item-row td{padding-top:12px;}
  .add-cat-form{display:flex; gap:8px; margin-top:6px;}
  .add-cat-form input{background:rgba(0,0,0,.2); border:1px solid rgba(201,162,74,.3); color:var(--ivory); padding:8px; border-radius:4px; font-size:.85rem;}
  .order-card{background:rgba(0,0,0,.2); border:1px solid rgba(201,162,74,.2); border-radius:6px; padding:14px 16px;}
  .order-card-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; flex-wrap:wrap; gap:8px;}
  .order-badge{padding:2px 10px; border-radius:12px; font-size:.7rem; text-transform:uppercase; letter-spacing:.04em; font-weight:600;}
  .badge-new{background:#a3492f; color:#fff;}
  .badge-preparing{background:#8a6e30; color:#fff;}
  .badge-done{background:#2f4a3a; color:#fff;}
  .order-meta{font-size:.8rem; opacity:.75; margin-bottom:8px;}
  .order-items{font-size:.85rem; margin-bottom:10px; line-height:1.6;}
  .order-actions{display:flex; gap:8px; flex-wrap:wrap;}
  .order-actions button{font-size:.72rem; padding:6px 10px;}
  .order-total{font-weight:700; color:var(--gold-light);}

  #loginGate{
    position:fixed; inset:0; background:var(--maroon-deep); z-index:999;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  #loginGate .box{
    background:var(--maroon); border:1px solid rgba(201,162,74,.35); border-radius:10px;
    padding:32px; max-width:340px; width:100%; text-align:center;
  }
  #loginGate h2{color:var(--gold-light); font-size:1.2rem; margin-bottom:6px;}
  #loginGate p{opacity:.7; font-size:.82rem; margin-bottom:18px;}
  #loginGate input{
    width:100%; padding:11px 12px; border-radius:6px; border:1px solid rgba(201,162,74,.35);
    background:rgba(0,0,0,.25); color:var(--cream); font-size:.9rem; margin-bottom:12px;
  }
  #loginGate button{width:100%;}
  #loginError{color:#ff8a7a; font-size:.78rem; min-height:16px; margin-top:8px;}
  #adminApp{display:none;}

  @media (max-width: 700px){
    body{padding:14px;}
    h1{font-size:1.2rem;}
    .toolbar{gap:8px;}
    .toolbar .btn, .toolbar button{padding:9px 12px; font-size:.8rem;}
    .add-cat-form{flex-direction:column;}

    table, thead, tbody, tr{display:block; width:100%;}
    thead{display:none;}
    tbody tr{
      border:1px solid rgba(201,162,74,.3); border-radius:8px; padding:10px 12px;
      margin-bottom:14px; background:rgba(0,0,0,.15);
    }
    tbody tr.add-item-row{background:rgba(201,162,74,.06);}
    td{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      border-top:none !important; padding:8px 0 !important;
    }
    td[data-label]:not([data-label=""])::before{
      content:attr(data-label); flex:0 0 auto; font-size:.68rem; text-transform:uppercase;
      letter-spacing:.04em; color:var(--gold); opacity:.75; margin-right:8px;
    }
    td input{width:60%; text-align:right;}
    td .thumb-cell{width:100%; justify-content:space-between;}
    td.row-actions{justify-content:flex-end; gap:8px;}
    td.row-actions::before{display:none;}
    td[data-label="Photo"]{flex-direction:column; align-items:flex-start;}
    td[data-label="Photo"]::before{margin-bottom:6px;}
    tr.add-item-row td:last-child button{width:100%;}
  }
</style>
</head>
<body>

<div id="loginGate">
  <div class="box">
    <h2>🔒 Admin Login</h2>
    <p>Enter the admin password to manage your menu.</p>
    <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password">
    <button id="loginBtn">Login</button>
    <div id="loginError"></div>
  </div>
</div>

<div id="adminApp">

<h1>Lemino Pizza — Menu Admin</h1>
<div class="sub">Edit items, prices, and photos. Changes save automatically to the backend.</div>

<div class="toolbar">
  <a class="btn secondary" href="/" target="_blank">View live menu ↗</a>
  <a class="btn secondary" href="/qr.html" target="_blank">Generate Table QR Code ↗</a>
  <button id="addCatBtn">+ Add Category</button>
  <button id="toggleThemeBtn" class="secondary">🎨 Colour Theme</button>
  <button id="toggleOrdersBtn" class="secondary">🧾 Orders <span id="newOrdersBadge" style="display:none; background:var(--red); color:var(--ivory); border-radius:10px; padding:1px 7px; font-size:.7rem; margin-left:4px;"></span></button>
</div>

<div id="ordersPanel" class="category" style="display:none;">
  <div class="cat-head">
    <div><h2 style="color:var(--gold-light); font-size:1.1rem;">Orders</h2></div>
    <button id="refreshOrdersBtn" class="secondary">↻ Refresh</button>
  </div>
  <div id="ordersList" style="display:flex; flex-direction:column; gap:12px;"></div>
</div>

<div id="themePanel" class="category" style="display:none;">
  <div class="cat-head"><div><h2 style="color:var(--gold-light); font-size:1.1rem;">Colour Theme</h2></div></div>
  <div id="themeSwatches" style="display:flex; flex-wrap:wrap; gap:16px; margin:10px 0 16px;"></div>
  <div style="display:flex; gap:10px;">
    <button id="saveThemeBtn">Save Theme</button>
    <button id="resetThemeBtn" class="secondary">Reset to Default</button>
  </div>
</div>
<div id="addCatForm" class="add-cat-form" style="display:none;">
  <input id="newCatTitle" placeholder="Category title (e.g. Desserts)">
  <input id="newCatDesc" placeholder="Short description">
  <button id="saveCatBtn">Create</button>
</div>

<div id="categories"></div>

<div class="save-hint" id="saveHint">Saved ✓</div>

</div><!-- /#adminApp -->

<script>
const API = '';
const catsEl = document.getElementById('categories');
const saveHint = document.getElementById('saveHint');

// ---------- Admin password gate ----------
let ADMIN_PW = localStorage.getItem('adminPassword') || '';

// Every fetch() call in this file automatically sends the saved password.
const _origFetch = window.fetch.bind(window);
window.fetch = (url, opts = {}) => {
  opts.headers = { ...(opts.headers || {}), 'x-admin-password': ADMIN_PW };
  return _origFetch(url, opts);
};

const loginGate = document.getElementById('loginGate');
const adminApp = document.getElementById('adminApp');
const loginError = document.getElementById('loginError');

async function tryUnlock(password){
  ADMIN_PW = password;
  const res = await fetch('/api/admin/verify');
  if(res.ok){
    localStorage.setItem('adminPassword', password);
    loginGate.style.display = 'none';
    adminApp.style.display = 'block';
    return true;
  }
  ADMIN_PW = '';
  localStorage.removeItem('adminPassword');
  return false;
}

document.getElementById('loginBtn').addEventListener('click', async () => {
  const pw = document.getElementById('loginPassword').value;
  const ok = await tryUnlock(pw);
  if(!ok) loginError.textContent = 'Incorrect password. Try again.';
});
document.getElementById('loginPassword').addEventListener('keydown', (e) => {
  if(e.key === 'Enter') document.getElementById('loginBtn').click();
});

// If we have a saved password from a previous visit, try it silently.
(async () => {
  if(ADMIN_PW){
    const ok = await tryUnlock(ADMIN_PW);
    if(!ok) loginError.textContent = 'Session expired — please log in again.';
  }
})();

function flash(){
  saveHint.classList.add('show');
  setTimeout(() => saveHint.classList.remove('show'), 1200);
}

async function load(){
  const res = await fetch(API + '/api/menu');
  const menu = await res.json();
  render(menu);
}

function render(menu){
  catsEl.innerHTML = menu.map(cat => `
    <div class="category" data-cat="${cat.id}">
      <div class="cat-head">
        <div>
          <input class="cat-title" value="${escapeAttr(cat.title)}" data-cat="${cat.id}">
          <br>
          <input class="cat-desc desc" value="${escapeAttr(cat.desc || '')}" data-cat="${cat.id}">
        </div>
        <button class="danger del-cat" data-cat="${cat.id}">Delete Category</button>
      </div>
      <table>
        <thead><tr><th>Photo</th><th>Name</th><th>Size</th><th>Price ₹</th><th>Description</th><th></th></tr></thead>
        <tbody>
          ${cat.items.map(it => `
            <tr data-cat="${cat.id}" data-item="${it.id}">
              <td data-label="Photo">
                <div class="thumb-cell">
                  <img class="thumb" src="${it.image || placeholderSvg()}" alt="">
                  <div>
                    <input type="file" accept="image/*" class="photo-input" style="display:none">
                    <button class="secondary file-btn upload-btn">Upload</button>
                  </div>
                </div>
              </td>
              <td data-label="Name"><input class="f-name" value="${escapeAttr(it.name)}"></td>
              <td data-label="Size"><input class="f-size" value="${escapeAttr(it.size || '')}"></td>
              <td data-label="Price ₹"><input class="f-price" type="number" value="${it.price}"></td>
              <td data-label="Description"><input class="f-desc" value="${escapeAttr(it.desc || '')}"></td>
              <td class="row-actions" data-label="">
                <button class="secondary save-item-btn">Save</button>
                <button class="danger del-item-btn">✕</button>
              </td>
            </tr>
          `).join('')}
          <tr class="add-item-row" data-cat="${cat.id}">
            <td data-label=""></td>
            <td data-label="Name"><input class="new-name" placeholder="New item name"></td>
            <td data-label="Size"><input class="new-size" placeholder="e.g. Medium"></td>
            <td data-label="Price ₹"><input class="new-price" type="number" placeholder="0"></td>
            <td data-label="Description"><input class="new-desc" placeholder="Description"></td>
            <td data-label=""><button class="add-item-btn">+ Add</button></td>
          </tr>
        </tbody>
      </table>
    </div>
  `).join('');
}

function escapeAttr(s){ return String(s).replace(/"/g,'&quot;'); }
function placeholderSvg(){
  return 'data:image/svg+xml,' + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56"><rect width="100%" height="100%" fill="#3c0f18"/><text x="50%" y="55%" font-size="9" fill="#8a6e30" text-anchor="middle" font-family="sans-serif">no photo</text></svg>`
  );
}

// ---- category title/desc edits (blur to save) ----
catsEl.addEventListener('blur', async (e) => {
  if(e.target.classList.contains('cat-title') || e.target.classList.contains('cat-desc')){
    const catId = e.target.dataset.cat;
    const isTitle = e.target.classList.contains('cat-title');
    const body = isTitle ? {title: e.target.value} : {desc: e.target.value};
    await fetch(`/api/categories/${catId}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    flash();
  }
}, true);

catsEl.addEventListener('click', async (e) => {
  const row = e.target.closest('tr');

  // delete category
  if(e.target.classList.contains('del-cat')){
    if(!confirm('Delete this whole category and its items?')) return;
    await fetch(`/api/categories/${e.target.dataset.cat}`, {method:'DELETE'});
    load();
    return;
  }

  // delete item
  if(e.target.classList.contains('del-item-btn')){
    const catId = row.dataset.cat, itemId = row.dataset.item;
    if(!confirm('Delete this item?')) return;
    await fetch(`/api/categories/${catId}/items/${itemId}`, {method:'DELETE'});
    load();
    return;
  }

  // save item text fields
  if(e.target.classList.contains('save-item-btn')){
    const catId = row.dataset.cat, itemId = row.dataset.item;
    const body = {
      name: row.querySelector('.f-name').value,
      size: row.querySelector('.f-size').value,
      price: Number(row.querySelector('.f-price').value),
      desc: row.querySelector('.f-desc').value,
    };
    await fetch(`/api/categories/${catId}/items/${itemId}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    flash();
    return;
  }

  // trigger file picker
  if(e.target.classList.contains('upload-btn')){
    row.querySelector('.photo-input').click();
    return;
  }

  // add new item
  if(e.target.classList.contains('add-item-btn')){
    const catId = row.dataset.cat;
    const name = row.querySelector('.new-name').value.trim();
    const price = Number(row.querySelector('.new-price').value);
    if(!name || !price){ alert('Name and price required'); return; }
    const body = {
      name,
      size: row.querySelector('.new-size').value,
      price,
      desc: row.querySelector('.new-desc').value,
    };
    await fetch(`/api/categories/${catId}/items`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    load();
    return;
  }
});

// photo upload on file select
catsEl.addEventListener('change', async (e) => {
  if(!e.target.classList.contains('photo-input')) return;
  const row = e.target.closest('tr');
  const catId = row.dataset.cat, itemId = row.dataset.item;
  const file = e.target.files[0];
  if(!file) return;
  const fd = new FormData();
  fd.append('photo', file);
  const res = await fetch(`/api/categories/${catId}/items/${itemId}/photo`, {method:'POST', body: fd});
  if(res.ok){
    const updated = await res.json();
    row.querySelector('.thumb').src = updated.image;
    flash();
  } else {
    alert('Upload failed');
  }
});

// add category form
document.getElementById('addCatBtn').addEventListener('click', () => {
  document.getElementById('addCatForm').style.display = 'flex';
});
document.getElementById('saveCatBtn').addEventListener('click', async () => {
  const title = document.getElementById('newCatTitle').value.trim();
  const desc = document.getElementById('newCatDesc').value.trim();
  if(!title) return alert('Title required');
  await fetch('/api/categories', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({title, desc})});
  document.getElementById('newCatTitle').value = '';
  document.getElementById('newCatDesc').value = '';
  document.getElementById('addCatForm').style.display = 'none';
  load();
});

// ---------- Orders ----------
const ordersPanel = document.getElementById('ordersPanel');
const ordersList = document.getElementById('ordersList');
const newOrdersBadge = document.getElementById('newOrdersBadge');
let ordersPollTimer = null;

document.getElementById('toggleOrdersBtn').addEventListener('click', async () => {
  const showing = ordersPanel.style.display !== 'none';
  if(showing){
    ordersPanel.style.display = 'none';
    clearInterval(ordersPollTimer);
    return;
  }
  ordersPanel.style.display = 'block';
  await loadOrders();
  ordersPollTimer = setInterval(loadOrders, 20000); // auto-refresh every 20s
});

document.getElementById('refreshOrdersBtn').addEventListener('click', loadOrders);

async function loadOrders(){
  try{
    const res = await fetch('/api/orders');
    const orders = await res.json();
    renderOrders(orders);
    checkNewOrdersBadge(orders);
  }catch(err){ console.error(err); }
}

// badge shows count of orders still 'new' even when the panel is closed
function checkNewOrdersBadge(orders){
  const newCount = orders.filter(o => o.status === 'new').length;
  if(newCount > 0){
    newOrdersBadge.style.display = 'inline-block';
    newOrdersBadge.textContent = newCount;
  } else {
    newOrdersBadge.style.display = 'none';
  }
}
// poll for badge even when panel is closed
setInterval(async () => {
  if(ordersPanel.style.display === 'none'){
    try{
      const res = await fetch('/api/orders');
      const orders = await res.json();
      checkNewOrdersBadge(orders);
    }catch(err){}
  }
}, 20000);
fetch('/api/orders').then(r => r.json()).then(checkNewOrdersBadge).catch(() => {});

function escapeHtml(s){
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function renderOrders(orders){
  if(orders.length === 0){
    ordersList.innerHTML = '<div style="opacity:.6; padding:20px 0; text-align:center;">No orders yet.</div>';
    return;
  }
  ordersList.innerHTML = orders.map(o => {
    const time = new Date(o.createdAt).toLocaleString('en-IN', { dateStyle:'medium', timeStyle:'short' });
    const badgeClass = o.status === 'new' ? 'badge-new' : o.status === 'preparing' ? 'badge-preparing' : 'badge-done';
    const itemsHtml = o.items.map(it => `${escapeHtml(it.name)}${it.size ? ' ('+escapeHtml(it.size)+')' : ''} × ${Number(it.qty)||0} — ₹${(Number(it.qty)||0)*(Number(it.price)||0)}`).join('<br>');
    let locationHtml = '';
    if(o.orderType === 'dinein'){
      locationHtml = `Table #${escapeHtml(o.tableNumber)}`;
    } else {
      const parts = [];
      if(o.address) parts.push(escapeHtml(o.address));
      if(o.location && typeof o.location.lat === 'number' && typeof o.location.lng === 'number'){
        parts.push(`<a href="https://maps.google.com/?q=${o.location.lat},${o.location.lng}" target="_blank" style="color:var(--gold-light);">📍 View on map</a>`);
      }
      locationHtml = parts.join(' · ') || '—';
    }
    return `
      <div class="order-card" data-order="${escapeHtml(o.id)}">
        <div class="order-card-head">
          <div>
            <span class="order-badge ${badgeClass}">${escapeHtml(o.status)}</span>
            <span style="margin-left:8px; font-size:.8rem; text-transform:uppercase; letter-spacing:.04em; opacity:.8;">${o.orderType === 'dinein' ? 'Dine-in' : 'Delivery'}</span>
          </div>
          <span class="order-total">₹${Number(o.total)||0}</span>
        </div>
        <div class="order-meta">${time} ${o.customerName ? '· ' + escapeHtml(o.customerName) : ''} ${o.customerPhone ? '· ' + escapeHtml(o.customerPhone) : ''}</div>
        <div class="order-meta"><b>${locationHtml}</b></div>
        <div class="order-items">${itemsHtml}</div>
        <div class="order-actions">
          ${o.status !== 'preparing' ? `<button class="secondary status-btn" data-status="preparing">Mark Preparing</button>` : ''}
          ${o.status !== 'done' ? `<button class="secondary status-btn" data-status="done">Mark Done</button>` : ''}
          <button class="danger del-order-btn">Delete</button>
        </div>
      </div>
    `;
  }).join('');
}

ordersList.addEventListener('click', async (e) => {
  const card = e.target.closest('.order-card');
  if(!card) return;
  const orderId = card.dataset.order;

  if(e.target.classList.contains('status-btn')){
    await fetch(`/api/orders/${orderId}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({status: e.target.dataset.status})});
    loadOrders();
  }
  if(e.target.classList.contains('del-order-btn')){
    if(!confirm('Delete this order?')) return;
    await fetch(`/api/orders/${orderId}`, {method:'DELETE'});
    loadOrders();
  }
});

// ---------- Theme editor ----------
const THEME_LABELS = {
  '--maroon-deep': 'Background (Darkest)',
  '--maroon': 'Card Background',
  '--maroon-light': 'Card Hover',
  '--gold': 'Primary Accent (Gold)',
  '--gold-light': 'Headings / Highlights',
  '--gold-dim': 'Muted Gold',
  '--cream': 'Body Text',
  '--ivory': 'Bright Text',
  '--forest': 'Secondary Accent (Green)',
  '--terracotta': 'Tertiary Accent (Red)'
};

const themePanel = document.getElementById('themePanel');
const themeSwatches = document.getElementById('themeSwatches');
let currentTheme = {};

document.getElementById('toggleThemeBtn').addEventListener('click', async () => {
  const showing = themePanel.style.display !== 'none';
  if(showing){ themePanel.style.display = 'none'; return; }
  themePanel.style.display = 'block';
  await loadTheme();
});

async function loadTheme(){
  const res = await fetch('/api/theme');
  currentTheme = await res.json();
  renderTheme();
}

function renderTheme(){
  themeSwatches.innerHTML = Object.entries(THEME_LABELS).map(([key, label]) => `
    <label style="display:flex; flex-direction:column; gap:6px; font-size:.75rem; color:var(--cream);">
      ${label}
      <input type="color" data-key="${key}" value="${currentTheme[key] || '#000000'}" style="width:56px; height:36px; border:none; border-radius:4px; cursor:pointer; background:none;">
    </label>
  `).join('');
}

document.getElementById('saveThemeBtn').addEventListener('click', async () => {
  const body = {};
  themeSwatches.querySelectorAll('input[type=color]').forEach(inp => {
    body[inp.dataset.key] = inp.value;
  });
  await fetch('/api/theme', {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  flash();
  alert('Theme saved! Live menu ko refresh karke check karo.');
});

document.getElementById('resetThemeBtn').addEventListener('click', async () => {
  if(!confirm('Default colours pe wapas jaana hai?')) return;
  const defaults = {
    '--maroon-deep': '#20080d', '--maroon': '#3c0f18', '--maroon-light': '#5a1b28',
    '--gold': '#c9a24a', '--gold-light': '#e8cf8c', '--gold-dim': '#8a6e30',
    '--cream': '#f3e8d3', '--ivory': '#faf5e8', '--forest': '#2f4a3a', '--terracotta': '#a3492f'
  };
  await fetch('/api/theme', {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(defaults)});
  currentTheme = defaults;
  renderTheme();
  flash();
});

load();
</script>
</body>
</html>
